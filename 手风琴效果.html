<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手风琴效果图片</title>
    <style>
        /* 容器样式 */
        .accordion {
            display: flex;
            width: 1000px;
            margin: 50px auto;
            overflow: hidden;
        }

        /* 图片样式 */
        .accordion img {
            width: 100px;
            height: 600px;
            object-fit: cover;
            transition: width 0.5s ease;
        }

        /* 鼠标悬停时图片的样式 */
        .accordion img:hover {
            width: 800px;
        }
        .accordion img:nth-child(1){
          width: 800px;
        }
    </style>
</head>

<body>
    <!-- 手风琴容器 -->
    <div class="accordion">
        <img src="../微信图片_20240811185159.jpg" alt="Image 1">
        <img src="../微信图片_20240811185159.jpg" alt="Image 2">
        <img src="../微信图片_20240811185159.jpg" alt="Image 3">
        <img src="../微信图片_20240811185159.jpg" alt="Image 4">
    </div>

    <script>
        // 获取所有图片元素
        const images = document.querySelectorAll('.accordion img');

        // 为每个图片元素添加鼠标悬停事件监听器
        images.forEach((image) => {
            image.addEventListener('mouseenter', () => {
                // 当鼠标悬停在某个图片上时，将该图片宽度设置为 500px
                image.style.width = '800px';
                // 其他图片宽度设置为 100px
                images.forEach((otherImage) => {
                    if (otherImage !== image) {
                        otherImage.style.width = '100px';
                    }
                });
            });
        });
    </script>
</body>

</html>
