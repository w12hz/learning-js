<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    h3{
      text-align: center;
    }
    table{
      /* 合并相邻边框 */
      border-collapse: collapse;
      height: 50px;
      margin: 0 auto;
      text-align: center;
    }
    table,th,td{
      border: 1px solid #000;
    }
    th{
      padding: 5px 20px;
    }
  </style>
</head>
<body>
  <h3>订单确认</h3>
  
  <script>
    let price=+prompt('请输入价格')
    let num=+prompt('请输入数量')
    let add=prompt('请输入地址')
    let total=num*price
    document.write(` <table>
    
    <tr>
      <th>商品名称</th>
      <th>商品价格</th>
      <th>商品数量</th>
      <th>总价</th>
      <th>收货地址</th>
    </tr>
    <tr>
      <th>aaa</th>
      <th>${price}</th>
      <th>${num}</th>
      <th>${total}</th>
      <th>${add}</th>
    </tr>
  </table>
    `)

  </script>
</body>
</html>
