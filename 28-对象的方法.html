<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    let obj={
      uname:'小明',
      // 方法  匿名函数的写法
      song: function(){
        console.log("冰雨")
      }
//在对象里面的是方法，外面的是函数
    }
    // 方法调用 对象名。方法名
    obj.song()
    // console.log( obj.song())输出结果为undifined 因为函数没有return返回undefined
  </script>
</body>
</html>
