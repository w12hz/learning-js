<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>诗句点击弹框</title>
  <style>
    /* 隐藏模态框 */
    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.4);
    }

    /* 模态框内容样式 */
    .modal-content {
      background-color: #fefefe;
      margin: 15% auto;
      padding: 20px;
      border: 1px solid #888;
      width: 80%;
    }

    /* 关闭按钮样式 */
    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
    }

    .close:hover,
    .close:focus {
      color: black;
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <!-- 包含诗句的元素 -->
  <div class="box1">
    床前明月光，疑是地上霜。
  </div>
  <div class="box1">
    举头望明月，低头思故乡。
  </div>
  <!-- 模态框 -->
  <div id="myModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <p id="modalText"></p>
    </div>
  </div>

  <script>
    // 获取所有包含诗句的元素
    const poem = document.querySelectorAll('.box1');
    // 获取模态框元素
    const modal = document.getElementById('myModal');
    // 获取关闭按钮元素
    const closeBtn = document.querySelector('.close');
    // 获取模态框内显示文本的元素
    const modalText = document.getElementById('modalText');

    // 为每个包含诗句的元素添加点击事件监听器
    poem.forEach(item => {
      item.addEventListener('click', function () {
        // 将点击元素的文本内容显示在模态框中
        modalText.textContent = this.textContent;
        // 显示模态框
        modal.style.display = 'block';
      });
    });

    // 为关闭按钮添加点击事件监听器
    closeBtn.addEventListener('click', function () {
      // 隐藏模态框
      modal.style.display = 'none';
    });

    // 当用户点击模态框外部区域时，隐藏模态框
    window.addEventListener('click', function (event) {
      if (event.target === modal) {
        modal.style.display = 'none';
      }
    });
  </script>
</body>

</html>
