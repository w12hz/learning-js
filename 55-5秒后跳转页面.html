<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <a href="http://www.itcast.cn"><span>5</span>秒钟后跳转</a>
  <script>
    //1 获取元素
    const a=document.querySelector('a')
    let num=5
    let timeid =setInterval(function(){
      num--
      a.innerHTML=`支付成功<span>${num}</span>秒钟后跳转`
      //如果num===0 时间到了，停止定时器，跳转页面
      if(num===0){
        clearInterval(timeid)
      //跳转页面
      location.href='http://www.itcast.cn'}
    },1000);
  </script>
</body>
</html>
