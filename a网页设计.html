<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>春意</title>
  <style>
    
     /* 清除默认样式 */
     *{
      margin: 0;
      padding: 0;
    }
    .box{
      margin: 0 auto;

      width: 1226px;
      height: 614px;
      /* background-color:rgb(224, 188, 142); */

    }
    .box1{
      background-image: url(../背景图.jpg);
      width: 2000px;
      height: 2000px;
    background-repeat: no-repeat;
    background-size: cover;
    }
    .left
    {
      float: left;
      width: 234px;
      height: 614px;
      background-color: #b08787;
    }
    .right{
      float: right;
      width: 978px;
      height: 614px;
      /* background-color: #b4b07b;
       */
    }
    ul{
      /* 清楚列表符号 */
      list-style: none;
     
    }
    /* 使八个小盒子有间距 */
    .right li{
      float: left;
      margin-right: 14px;
      margin-bottom: 14px;
      width: 234px;
      height: 300px;
      background-color: #d3eec4;
    }
    /* 如果父级宽度不够，子级会自动换行 */
    /* 第四个li和第八个li的右间距清除，否则盒子装不下自动换行 */
    .right li:nth-child(4n){
      margin-right: 0;
    }
  </style>
</head>
<body>
  <div class="box1">

  <div class="box">
    <div class="left"></div>
    <div class="right">
      <!-- 八个大小一样的小盒子用li -->
      <ul>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
      </ul>
    </div>
  </div>

</div>
</body>
</html>
