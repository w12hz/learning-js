<body>
  <script>
    //存储方式 uname要加引号
    localStorage.setItem('uname','aa')
    //获取方式 要加引号
    console.log(localStorage.getItem('uname'));
    //删除本地存储
    localStorage.removeItem('uname')
    //改 直接改
    localStorage.setItem('uname','b')
    //本地存储只能存储字符串
      </script>
</body>
