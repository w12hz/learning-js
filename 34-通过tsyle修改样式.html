<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box{
      width: 200px;
      height: 200px;
      background-color: #c19494;
    }
  </style>
</head>
<body>
  <div class="box">

  </div>
  <script>
    // 1.获取元素
    const box=document.querySelector('.box')
    // 2.修改样式属性 对象.style.样式属性='值'  别忘了单位
    box.style.width='300px'
    // 多组单词采取 小驼峰命名法
    box.style.backgroundColor='#eeddff'
    box.style.border='2px solid pink'
  </script>
</body>
</html>
