<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
      margin: 0;
      padding: 0;
    }
    h2{
      text-align: center;
    }
    .box{
      width: 600px;
      margin: 50px auto;
      display: flex;
      font-size: 25px;
      line-height: 40px;
    }
    .qs{
      width: 450px;
      height: 40px;
      color: rgb(109, 124, 119);    
    }
    .btns{
      text-align: center;
    }
    .btns button{
      width: 120px;
      height: 35px;
      margin: 0 50px;
    }
  </style>
</head>
<body>
  <h2>随机点名</h2>
  <div class="box">
    <span>名字是：</span>
    <div class="qs">这里显示名字</div>
  </div>
  <div class="btns">
   <button class="start">开始</button>
   <button class="end">结束</button>
  </div>
  <script>
    // 数据数组
    const arr=['温','李','刘','赵','张','莫','谢','周','陆','韩']
    // 定时器的全局变量
    let timeID=0
    // 随机号要全局变量
    let random=0
  // 1开始按钮模块
  const qs=document.querySelector('.qs')
  // 1.1获取开始按钮对象
  const start=document.querySelector('.start')
  // 1.2添加点击事件
  start.addEventListener('click',function(){
  timeID= setInterval(function(){
     // 随机数
  random=parseInt(Math.random()*arr.length)
 
 qs.innerHTML=arr[random]
   },100)
  //  如果数组只剩一个元素，不需要再抽取，禁用两个按钮
  if(arr.length===1){
    start.disabled=true
    end.disabled=true
    clearInterval(timeID)
  }
  })
  // 2关闭按钮模块
  const end=document.querySelector('.end')
  end.addEventListener('click',function(){
    clearInterval(timeID)
    // 结束后删除元素
    arr.splice(random,1)

  })
  </script>
</body>
</html>
