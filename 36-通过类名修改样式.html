<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box{
      width: 400px;
      height: 200px;
      background-color: #b59b9b;
      border: 1px solid #eeff2e;
      margin: 20px auto;

    }
  </style>
</head>
<body>
  <div></div>
  <script>
    // 1.获取元素
    const div=document.querySelector('div')
    // 2.添加类名 要添加多个类名在类名间加空格
    div.className='box'
    
  </script>
</body>
</html>
