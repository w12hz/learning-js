<body>
  <script>
    const getsum=(...arr)=>{
      let sum=0
      for(i=0;i<arr.length;i++){
        sum+=arr[i]
      }
      return sum
    }
    console.log(getsum(1,2,3,4,5,6));
    
  </script>
</body>
