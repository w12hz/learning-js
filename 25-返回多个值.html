<body>
  <script>
    function getMaxMin(arr=[]){
      let max=arr[0]
      let min=arr[0]
      for(i=1;i<arr.length;i++){
        if(arr[i]>max)
        max=arr[i]
      if(arr[i]<min)
      min=arr[i]
      }
      return [max,min]
    }
    let m=getMaxMin([1,3,6,2,8,56,45,76])
    console.log(m)
  </script>
</body>
