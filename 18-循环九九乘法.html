<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    span{
      display: inline-block;
      width: 60px;
      height: 20px;
      padding: 5px 10px;
      margin: 2px;
      border: 1px solid #e8c3c3;
      text-align: center;
      border-radius: 5px;
      box-shadow: 2px 2px 2px #171b19;
      background-color: #c9dde0;
      transition: all 1s;
    }
    span:hover{
      background-color: #d57979;
    }
  </style>
</head>
<body>
  <script>
    for(let i=1;i<=9;i++){
      for(let j=1;j<=i;j++){
        document.write(`<span>${j}X${i}=${i*j}</span> `)

      }document.write(`<br>`)
    }
  </script>
</body>
</html>
