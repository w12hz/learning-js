<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    function getarrSum(arr=[]){
      // 将数组置为空，若调用函数没有传参时不会报错，若只写arr，且调用时不传参则无法求arr.length，会报错
      let sum=0
      for(let i=0;i<arr.length;i++){
        sum+=arr[i]
      }
      document.write(sum)
    }
    
    getarrSum([1,3,5,2,6])
   /* let arr=+prompt('输入')
    getarrSum(arr)写法错误*/
  </script>
</body>
</html>
