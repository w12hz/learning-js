<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    let arr=["a",'b','c','d']
    for(let k in arr){
      console.log(k)//数组的下标 索引号 但是是字符串'0'
      console.log(arr[k])
      // for in不常用因为k是字符串，不推荐遍历数组，一般用来遍历对象

    }
    let obj={
      uname:'aaa',
      age:18,
      gender:'nan'
    }
    // 遍历对象
    for(let k in obj){
      console.log(k)//k为属性名，是字符串'uname' 'age' 'gender'
      // console.log(obj.k)写法错误
      console.log(obj[k])//输出属性值
    }
    
  </script>
</body>
</html>
