<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  
</head>
<body>
  <button class="btn" disabled>
    我已阅读用户协议 </button>
  <script>
    const btn=document.querySelector('.btn')
    // 2倒计时
    let i=5
    // 开启计时器
    let n=setInterval(function(){
      i--
      btn.innerHTML=`我已阅读用户协议(${i})`
      if(i === 0){
        clearInterval(n)
        btn.disabled=false
        btn.innerHTML='同意'
      }
    },1000)
  </script>
</body>
</html>
