<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
 *{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body{
  /* background: linear-gradient(to right,rgb(207, 220, 226),rgb(236, 217, 220)); */
  background-color: #cce2eb;
}

.box{
  width: 80px;
  height: 80px;
  border-radius: 40px;
  border: 1px solid #3a96bd;
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
 top: 50%;
 left: 50%;
 transform: translate(-50%,-59%);
 background-color: #a3b9d6;
 transition: 0.5s ease-in-out;
 overflow: hidden;
}
.box:hover{
  width: 400px;
  height: 80px;
}
.box:focus{
  width: 400px;
  height: 50px;
}
input{
  width: 0px;
  height: 0px;
  border: none;
outline: none;
transition: 0.5s ease-in-out;
background-color: #cedaea;
/* border-radius: 20px; */
}
.box:hover input{
  width: 300px;
  height: 45px;
}
.box:hover button{
  width: 50px;
  height: 45px;
  border-radius: 0%;
  font-size: 15px;
  transition: 0.5s ease-in-out;
}
input:focus{
  color: rgb(165, 188, 188);
}
button{
  width: 80px;
  height: 80px;
  border-radius: 40px;
  border: none;
  background-color: #b8dce3;
  font-family: 仿宋;
  font-size: 25px;
  transition: 0.5s ease-in-out;
  /* display: none; */
}
</style>
<body>
  <div class="box">
    <input type="text">
    <button>搜索</button>
  </div>
</body>
</html>
