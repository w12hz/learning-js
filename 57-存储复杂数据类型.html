<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    const obj={
      uname:'a',
      age:18,
      gender:'女'

    }
    //存储 复杂数据类型   无法直接使用
   // localStorage.setItem('obj',obj)
    //取
    //console.log(localStorage.getItem('obj'))
    //1 复杂数据类型必须转换为JSON字符串存储
    //JSON 对象  属性和值都有引号 而且引号统一是双引号
    //{"uname":"a","age":18,"gender":"女"}
    localStorage.setItem('obj',JSON.stringify(obj))
    console.log(localStorage.getItem('obj'))
    //2 把JSON字符串转换为对象 JSON.parse(localStorage.getItem('obj'))
    const str=JSON.parse(localStorage.getItem('obj'))
    console.log(str);
    
  </script>
</body>
</html>
